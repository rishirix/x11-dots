[general]
live_config_reload = true
[window]
opacity = 0.83
padding = { x = 5, y = 5}
[scrolling]
history = 10000
multiplier = 5
[font]
size = 11
normal={family="JetBrainsMono Nerd Font",style="SemiBold"}
