<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <alias>
      <family>sans-serif</family>
      <prefer>
      <family>Inter Display</family>
      </prefer>
  </alias>

  <alias>
      <family>serif</family>
      <prefer>
          <family>Inter</family>
      </prefer>
  </alias>

  <alias>
      <family>monospace</family>
      <prefer>
          <family>JetBrainsMono Nerd Font</family>
      </prefer>
  </alias>

  <!-- Font-Weight -->
  <match target = "pattern" >
	  <test name = "family" >
		  <string>sans-serif</string>
	  </test>
	  <edit name="family" mode="prepend" >
		  <string>Inter</string>
	  </edit>
	  <edit name="weight" mode="assign" >
		  <const>Medium</const>
	  </edit>
	  <edit name="width" mode="assign" >
		  <const>Medium</const>
	  </edit>
  </match>

  </fontconfig>
