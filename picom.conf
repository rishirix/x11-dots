backend="glx";
vsync=true;
corner-radius=0;
use-damage=false;
xrender-sync-fence=true;

shadow=true;
shadow-radius=12;
shadow-opacity=0.55;

fading=true;
fade-in-step=0.2;
fade-out-step=0.2;

detect-client-opacity=true;
detect-rounded-corners=true;

shadow-exclude = [
"_GTK_FRAME_EXTENTS@",
"override_redirect = true",
];

blur-method="dual_kawase";
blur-strength = 4;

blur-background=true;
blur-background-frame=true;
blur-background-fixed=false;

blur-ignore-opacity=false;

blur-background-exclude = [
"window_type='dock'",
"window_type='desktop'",
"override_redirect = true",
"_GTK_FRAME_EXTENTS@"
];

animations = ({
triggers = ["close","hide"];
preset = "disappear";
scale="1";
duration="0.5";},
{triggers = ["open","show"];
preset = "appear";
scale="1";
duration="0.5";});

#mark-wmwin-focused=true;
#mark-ovredir-focused=true;
#dithered-present=true;
#detect-transient=true;

