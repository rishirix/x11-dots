backend="glx";
vsync=true;
corner-radius=0;
use-damage=false;
xrender-sync-fence=true;

shadow=true;
shadow-radius=20;
shadow-opacity=0.38;

fading=true;
fade-in-step=0.25;
fade-out-step=0.25;
fade-delta=10;

detect-client-opacity=true;
detect-rounded-corners=true;

shadow-exclude = [
"_GTK_FRAME_EXTENTS@",
"override_redirect = true",
];

blur-method="dual_kawase";
blur-strength = 8;

blur-background=true;
blur-background-frame=true;
blur-background-fixed=false;

blur-ignore-opacity=false;

blur-background-exclude = [
"window_type='dock'",
"window_type='desktop'",
"override_redirect = true",
"_GTK_FRAME_EXTENTS@"
];

animations = ({
triggers = ["close","hide"];
preset = "disappear";
#direction = "down";
scale="0.1";
duration=0.155;},
{triggers = ["open","show"];
preset = "appear";
#direction = "down";
scale="0.1";
duration=0.155;});

#mark-wmwin-focused=true;
#mark-ovredir-focused=true;
#dithered-present=true;
#detect-transient=true;
