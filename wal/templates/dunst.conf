[global]
    monitor = 0
    follow = mouse
    width = (0,400)
    height = (0,300)
    origin = top-right
    offset = (10,40)

    font = Sans 10
    line_height = 2
    padding = 8
    horizontal_padding = 8

    frame_width = 0
    frame_color = "{color2}"

    separator_height = 2
    separator_color = auto

    transparency = 0
    corner_radius = 8

    idle_threshold = 120

    markup = full
    format = "<b>%s</b>\n%b"
    alignment = left

    show_age_threshold = 60
    word_wrap = yes

    ignore_newline = no
    stack_duplicates = true
    hide_duplicate_count = false

    show_indicators = yes

    sort = yes

    shrink = no

    notification_limit = 5

    history_length = 20

    indicate_hidden = yes

    sticky_history = yes

    mouse_left_click = close_current
    mouse_middle_click = do_action
    mouse_right_click = close_all

[urgency_low]
    background = "{color0}"
    foreground = "{color15}"
    timeout = 2

[urgency_normal]
    background = "{color0}"
    foreground = "{color15}"
    timeout = 2

[urgency_critical]
    background = "{color1}"
    foreground = "{color0}"
    frame_color = "{color1}"
    timeout = 0
